<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Autenticación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
</head>

<body class="bg-light">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <!-- Navegación por pestañas -->
        <ul class="nav nav-tabs mb-4" id="authTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button"
              role="tab">Iniciar Sesión</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button"
              role="tab">Registrarse</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="recovery-tab" data-bs-toggle="tab" data-bs-target="#recovery" type="button"
              role="tab">Recuperar Contraseña</button>
          </li>
        </ul>

        <!-- Contenido de pestañas -->
        <div class="tab-content" id="authTabsContent">
          <!-- Login -->
          <div class="tab-pane fade show active" id="login" role="tabpanel">
            <div class="card">
              <div class="card-body">
                <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>
                <form id="loginForm" novalidate>
                  <div class="mb-3">
                    <label for="loginEmail" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="loginEmail" required>
                    <div class="invalid-feedback">Ingrese un correo válido.</div>
                  </div>
                  <div class="mb-3">
                    <label for="loginPassword" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="loginPassword" required>
                    <div class="invalid-feedback">Ingrese su contraseña.</div>
                  </div>
                  <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Registro -->
          <div class="tab-pane fade" id="register" role="tabpanel">
            <div class="card">
              <div class="card-body">
                <h3 class="card-title text-center mb-4">Crear Cuenta</h3>
                <form id="registerForm" novalidate>
                  <div class="mb-3">
                    <label for="registerName" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="registerName" required>
                    <div class="invalid-feedback">Ingrese su nombre.</div>
                  </div>
                  <div class="mb-3">
                    <label for="registerEmail" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="registerEmail" required>
                    <div class="invalid-feedback">Ingrese un correo válido.</div>
                  </div>
                  <div class="mb-3">
                    <label for="registerPassword" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="registerPassword" required>
                    <div class="invalid-feedback">Ingrese una contraseña.</div>
                  </div>
                  <button type="submit" class="btn btn-success w-100">Registrarse</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Recuperar contraseña -->
          <div class="tab-pane fade" id="recovery" role="tabpanel">
            <div class="card">
              <div class="card-body">
                <h3 class="card-title text-center mb-4">Recuperar Contraseña</h3>
                <form id="recoveryForm" novalidate>
                  <div class="mb-3">
                    <label for="recoveryEmail" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="recoveryEmail" required>
                    <div class="invalid-feedback">Ingrese un correo válido.</div>
                  </div>
                  <button type="submit" class="btn btn-warning w-100">Recuperar Contraseña</button>
                </form>
              </div>
            </div>
          </div>
        </div>

        <!-- Toast centrado en la parte superior -->
        <div class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index: 1060;">
          <div id="notificationToast" class="toast text-bg-info" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
              <strong class="me-auto" id="toastTitle">Notificación</strong>
              <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <style>
    .toast {
      opacity: 1 !important;
      transition: all 0.5s ease-in-out;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="login.js"></script>
</body>

</html>
